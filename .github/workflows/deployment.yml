name: deploy application
run-name: ${{ github.actor }} is deploying project

on:
  push:
  workflow_dispatch:
env:
  GROUP: /opt/mes-naissances
  PROJECT: ms-naissances

jobs:
  create-folder:
    runs-on: ubuntu-24.04
    steps:
       name: Execute remote SSH commands
       uses: appleboy/ssh-action@v1
       with:
       host: ${{ secrets.SERVER_HOST }}
       username: ${{ secrets.SERVER_USERNAME }}
       key: ${{ secrets.SSH_PRIVATE_KEY }}
       port: ${{ secrets.PORT }}
       script: |
          mkdir -p ${{env.GROUP}}/${{env.PROJECT}}

  build-project:
    runs-on: ubuntu-24.04
    needs: create-folder
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Setup java version
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build project
        run: |
          mvn clean package -DskipTests

      - name: Rename project
        run: |
          mv target/ms-naissances-*.jar target/ms-naissances.jar

      - name: Copy files on server
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.PORT }}
          source: target/ms-naissances.jar
          target: /opt/mes-naissances/microservice
          strip_components: 1
          overwrite: true

  run-project:
    name: Create folder on server
    runs-on: ubuntu-24.04
    needs: build-project
    steps:
      - name: Execute remote SSH commands
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.PORT }}
          script: |
            chmod +x ${{env.GROUP}} / ${{env.PROJECT}}/{{env.PROJECT}}.jar
            ln -sf ${{env.GROUP}} / ${{env.PROJECT}}/{{env.PROJECT}}.jar/ms-naissances.jar /etc/init.d/${{env.PROJECT}}
            /etc/init.d/${{env.PROJECT}} stop
            /etc/init.d/${{env.PROJECT}} start --spring.mail.host= ${{secrets.Mail_HOST}} --spring.datasource.username={{secrets.DATABASE_USERNAME}} --spring.datasource.password={{secrets.DATABASE_USERPASSWORD}} --spring.datasource.url={{secrets.DATABASE_URL}} --spring.sql.init.mode=always

