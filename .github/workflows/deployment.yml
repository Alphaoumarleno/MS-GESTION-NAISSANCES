name: deploy application
run-name: ${{ github.actor }} is deploying project

on:
  push:
  workflow_dispatch:

jobs:
  create-folder:
    runs-on: ubuntu-24.04
    steps:
      - name: Create folder on server
        run: |
          mkdir -p /opt/mes-naissances/microservice

  build-project:
    runs-on: ubuntu-24.04
    needs: create-folder
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Setup java version
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build project
        run: |
          mvn clean package -DskipTests

      - name: Rename project
        run: |
          mv target/ms-naissances-*.jar target/ms-naissances.jar

      - name: Copy files on server
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.PORT }}
          source: target/ms-naissances.jar
          target: /opt/mes-naissances/microservice
          strip_components: 1
          overwrite: true

  run-project:
    name: Create folder on server
    runs-on: ubuntu-24.04
    needs: build-project
    steps:
      - name: Execute remote SSH commands
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.PORT }}
          script: |
            ln -sf /opt/mes-naissances/microservice/ms-naissances.jar /etc/init.d/ms-naissances
            /etc/init.d/ms-naissances stop
            /etc/init.d/ms-naissances start
